<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Grand Prix Pong 3D</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(ellipse at top, #2a2a2a 0%, #0a0a0a 70%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e10600;
            /* Testo "estruso" 3D */
            text-shadow: 1px 1px 0 #900, 2px 2px 0 #800, 3px 3px 0 #700, 4px 4px 0 #600, 6px 8px 10px rgba(0,0,0,0.8);
        }
        #scoreboard {
            display: flex;
            gap: 60px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 0;
            background: linear-gradient(180deg, #3a3a3a 0%, #1c1c1c 100%);
            padding: 10px 30px;
            border-radius: 8px;
            border: 2px solid #555;
            box-shadow: 0 6px 0 #0d0d0d, 0 10px 20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.15);
            position: relative;
            z-index: 2;
        }
        .team-red { color: #ff3333; text-shadow: 0 0 10px rgba(255,50,50,0.6), 2px 2px 0 #000; }
        .team-orange { color: #ff8c1a; text-shadow: 0 0 10px rgba(255,140,26,0.6), 2px 2px 0 #000; }
        /* Prospettiva 3D del tracciato */
        .stage {
            perspective: 1100px;
            perspective-origin: 50% 0%;
            margin-top: -10px;
        }
        .track {
            position: relative;
            transform: rotateX(28deg);
            transform-origin: 50% 0%;
            transform-style: preserve-3d;
        }
        /* Spessore frontale (muretto) del circuito */
        .track::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            bottom: -34px;
            height: 34px;
            background: repeating-linear-gradient(90deg, #c00400 0 40px, #e8e8e8 40px 80px);
            transform-origin: top;
            transform: rotateX(-90deg);
            filter: brightness(0.6);
        }
        canvas {
            display: block;
            background-color: #3a3a3a;
            border: 10px solid #fff;
            border-image: repeating-linear-gradient(45deg, #e10600, #e10600 20px, #fff 20px, #fff 40px) 10;
            box-shadow: 0 40px 60px rgba(0,0,0,0.85);
        }
        .controls {
            margin-top: -40px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
        kbd {
            background: linear-gradient(#555, #333);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #666;
            box-shadow: 0 3px 0 #111;
        }
        /* Menu selezione modalità */
        #menu {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #menu.hidden { display: none; }
        .menu-box {
            background: linear-gradient(180deg, #2e2e2e 0%, #151515 100%);
            border: 2px solid #555;
            border-radius: 12px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 8px 0 #0a0a0a, 0 20px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
        }
        .menu-box h2 {
            margin: 0 0 8px;
            font-style: italic;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 2px;
        }
        .menu-box p { color: #aaa; margin: 0 0 22px; }
        .mode-btn {
            display: block;
            width: 300px;
            margin: 12px auto;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            text-transform: uppercase;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .mode-btn.pvp { background: linear-gradient(90deg, #e10600, #ff8000); box-shadow: 0 6px 0 #6a1d00; }
        .mode-btn.cpu { background: linear-gradient(90deg, #e10600, #444); box-shadow: 0 6px 0 #2a0000; }
        .mode-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .mode-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
        .mode-btn small { display: block; font-size: 12px; font-weight: normal; font-style: normal; opacity: 0.85; text-transform: none; }
    </style>
</head>
<body>
    <h1>🏎️ F1 PONG GRAND PRIX 🏁</h1>
    <div id="scoreboard">
        <span class="team-red">TEAM ROSSO: <span id="scoreLeft">0</span></span>
        <span class="team-orange">TEAM ORANGE: <span id="scoreRight">0</span></span>
    </div>
    <div class="stage">
        <div class="track">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
        </div>
    </div>
    <div class="controls">
        <p><strong>Comandi:</strong><br>
        Pilota Rosso (Sinistra): <kbd>W</kbd> Su / <kbd>S</kbd> Giù | <span id="rightControls">Pilota Orange (Destra): <kbd>Freccia Su</kbd> / <kbd>Freccia Giù</kbd></span></p>
    </div>
    <div id="menu">
        <div class="menu-box">
            <h2>🏁 Seleziona la modalità</h2>
            <p>Scegli come vuoi correre il Gran Premio</p>
            <button class="mode-btn pvp" onclick="startGame('pvp')">👥 Umano vs Umano<small>Rosso (W/S) contro Orange (Frecce)</small></button>
            <button class="mode-btn cpu" onclick="startGame('cpu')">🤖 Umano vs Computer<small>Tu guidi il Rosso (W/S), il Computer guida l'Orange</small></button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Punteggi
        let scoreLeft = 0;
        let scoreRight = 0;
        const maxScore = 5;

        // Configurazione Auto (Palette)
        const carWidth = 18;
        const carLength = 65;
        let leftCarY = canvas.height / 2 - carLength / 2;
        let rightCarY = canvas.height / 2 - carLength / 2;
        const carSpeed = 8;

        // Configurazione Pneumatico (Pallina)
        let ballX = canvas.width / 2;
        let ballY = canvas.height / 2;
        const ballRadius = 10;
        let baseSpeed = 4;
        let ballSpeedX = baseSpeed;
        let ballSpeedY = baseSpeed;
        let speedMultiplier = 1.1;

        // Modalità di gioco
        let gameMode = null;   // 'pvp' oppure 'cpu'
        let running = false;
        const cpuSpeed = carSpeed * 0.72; // il computer è un po' più lento di un umano
        let cpuError = 0;                 // imprecisione del computer

        function startGame(mode) {
            gameMode = mode;
            document.getElementById("menu").classList.add("hidden");
            document.getElementById("rightControls").innerHTML =
                mode === "cpu" ? "Pilota Orange (Destra): 🤖 <strong>Computer</strong>"
                               : "Pilota Orange (Destra): <kbd>Freccia Su</kbd> / <kbd>Freccia Giù</kbd>";
            resetBall(Math.random() > 0.5 ? 1 : -1);
            running = true;
        }

        // Intelligenza artificiale della monoposto Orange
        function updateCPU() {
            const center = rightCarY + carLength / 2;
            let target;
            if (ballSpeedX > 0) {
                // Il pneumatico arriva verso il computer: insegue la palla con un piccolo errore
                target = ballY + cpuError;
            } else {
                // Il pneumatico si allontana: torna verso il centro pista
                target = canvas.height / 2;
            }
            const diff = target - center;
            if (Math.abs(diff) > 4) {
                rightCarY += Math.sign(diff) * Math.min(cpuSpeed, Math.abs(diff));
            }
            rightCarY = Math.max(0, Math.min(canvas.height - carLength, rightCarY));
        }

        // Effetti 3D
        let spin = 0, bounceT = 0;
        const trail = [];
        const sparks = [];

        // Colori team
        const TEAMS = {
            red:    { main: "#e10600", light: "#ff5a4f", dark: "#7a0300", wing: "#ffffff", wingDark: "#9a9a9a", helmet: "#ffe000" },
            orange: { main: "#ff8000", light: "#ffb35c", dark: "#8a3f00", wing: "#1e1e1e", wingDark: "#000000", helmet: "#2fb7ff" }
        };

        // Input tastiera
        const keys = {};
        window.addEventListener("keydown", e => { keys[e.key] = true; if (e.key.startsWith("Arrow")) e.preventDefault(); });
        window.addEventListener("keyup", e => keys[e.key] = false);

        // Asfalto pre-renderizzato (texture + illuminazione)
        const bg = document.createElement("canvas");
        bg.width = canvas.width; bg.height = canvas.height;
        (function buildAsphalt() {
            const b = bg.getContext("2d");
            b.fillStyle = "#3a3a3a";
            b.fillRect(0, 0, bg.width, bg.height);
            for (let i = 0; i < 9000; i++) {
                const v = 40 + Math.random() * 40;
                b.fillStyle = `rgba(${v},${v},${v},${Math.random() * 0.6})`;
                b.fillRect(Math.random() * bg.width, Math.random() * bg.height, 1.5, 1.5);
            }
            // Segni di gomma vicino alle auto
            b.fillStyle = "rgba(0,0,0,0.18)";
            b.fillRect(26, 0, 26, bg.height);
            b.fillRect(bg.width - 52, 0, 26, bg.height);
            // Cerchio di centrocampo
            b.strokeStyle = "rgba(255,255,255,0.25)";
            b.lineWidth = 4;
            b.beginPath(); b.arc(bg.width / 2, bg.height / 2, 60, 0, Math.PI * 2); b.stroke();
            // Luce dall'alto + vignettatura
            const g = b.createRadialGradient(bg.width / 2, bg.height * 0.35, 50, bg.width / 2, bg.height / 2, bg.width * 0.65);
            g.addColorStop(0, "rgba(255,255,255,0.10)");
            g.addColorStop(1, "rgba(0,0,0,0.55)");
            b.fillStyle = g;
            b.fillRect(0, 0, bg.width, bg.height);
        })();

        function rr(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // Gradiente "cilindrico" orizzontale per dare volume
        function hGrad(x, w, dark, light, main) {
            const g = ctx.createLinearGradient(x, 0, x + w, 0);
            g.addColorStop(0, dark);
            g.addColorStop(0.35, light);
            g.addColorStop(0.6, main);
            g.addColorStop(1, dark);
            return g;
        }

        function drawWheel(x, y, w, h) {
            ctx.fillStyle = hGrad(x, w, "#000", "#5a5a5a", "#262626");
            rr(x, y, w, h, 2); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.08)";
            for (let i = 2; i < h; i += 3) ctx.fillRect(x, y + i, w, 1);
        }

        // Monoposto F1 in pseudo-3D vista dall'alto
        function drawF1Car(x, y, team) {
            const c = TEAMS[team];
            // Ombra proiettata
            ctx.save();
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 12;
            ctx.fillStyle = "rgba(0,0,0,0.45)";
            rr(x + 4, y + 7, carWidth + 4, carLength, 6); ctx.fill();
            ctx.restore();

            // Ruote
            drawWheel(x - 4, y + 5, 6, 12);
            drawWheel(x + carWidth - 2, y + 5, 6, 12);
            drawWheel(x - 5, y + carLength - 17, 7, 14);
            drawWheel(x + carWidth - 2, y + carLength - 17, 7, 14);

            // Bracci sospensioni
            ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x, y + 11); ctx.lineTo(x + 4, y + 14);
            ctx.moveTo(x + carWidth, y + 11); ctx.lineTo(x + carWidth - 4, y + 14);
            ctx.stroke();

            // Muso affusolato
            ctx.fillStyle = hGrad(x + 4, carWidth - 8, c.dark, c.light, c.main);
            ctx.beginPath();
            ctx.moveTo(x + carWidth / 2 - 3, y + 2);
            ctx.lineTo(x + carWidth / 2 + 3, y + 2);
            ctx.lineTo(x + carWidth - 3, y + 22);
            ctx.lineTo(x + 3, y + 22);
            ctx.closePath(); ctx.fill();

            // Telaio
            ctx.fillStyle = hGrad(x, carWidth, c.dark, c.light, c.main);
            rr(x + 1, y + 18, carWidth - 2, carLength - 26, 4); ctx.fill();

            // Pance laterali
            ctx.fillStyle = hGrad(x - 2, carWidth + 4, c.dark, c.light, c.main);
            rr(x - 2, y + 32, carWidth + 4, 16, 5); ctx.fill();

            // Abitacolo + halo
            ctx.fillStyle = "#0a0a0a";
            rr(x + 4, y + 24, carWidth - 8, 15, 4); ctx.fill();
            ctx.strokeStyle = "#555"; ctx.lineWidth = 1.5;
            rr(x + 3.5, y + 23.5, carWidth - 7, 10, 4); ctx.stroke();

            // Casco sferico
            const hx = x + carWidth / 2, hy = y + 32;
            const hg = ctx.createRadialGradient(hx - 1.5, hy - 1.5, 0.5, hx, hy, 4.5);
            hg.addColorStop(0, "#fff"); hg.addColorStop(0.4, c.helmet); hg.addColorStop(1, "#222");
            ctx.fillStyle = hg;
            ctx.beginPath(); ctx.arc(hx, hy, 4.2, 0, Math.PI * 2); ctx.fill();

            // Alettoni con spessore
            const wingGrad = (wy) => {
                const g = ctx.createLinearGradient(0, wy, 0, wy + 5);
                g.addColorStop(0, c.wing); g.addColorStop(1, c.wingDark);
                return g;
            };
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(x - 3, y + 4, carWidth + 6, 2);
            ctx.fillRect(x - 4, y + carLength, carWidth + 8, 2);
            ctx.fillStyle = wingGrad(y);
            ctx.fillRect(x - 3, y, carWidth + 6, 4);
            ctx.fillStyle = wingGrad(y + carLength - 4);
            ctx.fillRect(x - 4, y + carLength - 4, carWidth + 8, 4);

            // Riflesso lucido
            ctx.fillStyle = "rgba(255,255,255,0.25)";
            rr(x + 5, y + 42, 3, 12, 1.5); ctx.fill();
        }

        // Pneumatico 3D con rotazione, rimbalzo e ombra
        function drawTire(x, y, radius) {
            const h = Math.abs(Math.sin(bounceT)) * 7; // altezza dal suolo

            // Scia
            trail.forEach((p, i) => {
                ctx.fillStyle = `rgba(30,30,30,${(i / trail.length) * 0.35})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, radius * (i / trail.length), 0, Math.PI * 2); ctx.fill();
            });

            // Ombra (si allarga e schiarisce quando sale)
            ctx.fillStyle = `rgba(0,0,0,${0.55 - h * 0.04})`;
            ctx.beginPath();
            ctx.ellipse(x + 4 + h * 0.6, y + 6 + h * 0.6, radius + h * 0.3, (radius + h * 0.3) * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            const by = y - h;
            ctx.save();
            ctx.translate(x, by);

            // Spalla dello pneumatico
            const g = ctx.createRadialGradient(-radius * 0.4, -radius * 0.4, 1, 0, 0, radius);
            g.addColorStop(0, "#555"); g.addColorStop(0.6, "#1a1a1a"); g.addColorStop(1, "#000");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

            // Banda colorata mescola (soft = rossa)
            ctx.strokeStyle = "#e10600"; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, 0, radius * 0.72, 0, Math.PI * 2); ctx.stroke();

            // Cerchione oro con raggi rotanti
            ctx.rotate(spin);
            const rg = ctx.createRadialGradient(-1.5, -1.5, 0.5, 0, 0, radius * 0.5);
            rg.addColorStop(0, "#fff3b0"); rg.addColorStop(0.5, "#d4af37"); rg.addColorStop(1, "#7a5c10");
            ctx.fillStyle = rg;
            ctx.beginPath(); ctx.arc(0, 0, radius * 0.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#5c4508"; ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
                const a = (i / 5) * Math.PI * 2;
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * radius * 0.48, Math.sin(a) * radius * 0.48); ctx.stroke();
            }
            ctx.restore();

            // Riflesso speculare
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.beginPath(); ctx.ellipse(x - radius * 0.35, by - radius * 0.45, radius * 0.35, radius * 0.18, -0.6, 0, Math.PI * 2); ctx.fill();
        }

        function spawnSparks(x, y, dir) {
            for (let i = 0; i < 14; i++) {
                sparks.push({ x, y, vx: dir * (Math.random() * 4 + 1), vy: (Math.random() - 0.5) * 5, life: 1 });
            }
        }

        function resetBall(direction) {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = direction * baseSpeed;
            ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * baseSpeed;
            trail.length = 0;
        }

        function update() {
            if (keys["w"] || keys["W"]) leftCarY = Math.max(0, leftCarY - carSpeed);
            if (keys["s"] || keys["S"]) leftCarY = Math.min(canvas.height - carLength, leftCarY + carSpeed);
            if (gameMode === "cpu") {
                updateCPU();
            } else {
                if (keys["ArrowUp"]) rightCarY = Math.max(0, rightCarY - carSpeed);
                if (keys["ArrowDown"]) rightCarY = Math.min(canvas.height - carLength, rightCarY + carSpeed);
            }

            ballX += ballSpeedX;
            ballY += ballSpeedY;

            const speed = Math.hypot(ballSpeedX, ballSpeedY);
            spin += (speed / ballRadius) * Math.sign(ballSpeedX || 1);
            bounceT += 0.12 + speed * 0.01;
            trail.push({ x: ballX, y: ballY });
            if (trail.length > 10) trail.shift();

            if (ballY - ballRadius <= 0 || ballY + ballRadius >= canvas.height) {
                ballSpeedY = -ballSpeedY;
            }

            // Collisione con Auto Sinistra
            if (ballX - ballRadius <= 30 + carWidth && ballX - ballRadius >= 30) {
                if (ballY >= leftCarY && ballY <= leftCarY + carLength) {
                    ballSpeedX = -ballSpeedX * speedMultiplier;
                    let hitPoint = ballY - (leftCarY + carLength / 2);
                    ballSpeedY = hitPoint * 0.2;
                    ballX = 30 + carWidth + ballRadius;
                    spawnSparks(ballX - ballRadius, ballY, 1);
                    cpuError = (Math.random() - 0.5) * carLength * 1.1;
                }
            }

            // Collisione con Auto Destra
            if (ballX + ballRadius >= canvas.width - 30 - carWidth && ballX + ballRadius <= canvas.width - 30) {
                if (ballY >= rightCarY && ballY <= rightCarY + carLength) {
                    ballSpeedX = -ballSpeedX * speedMultiplier;
                    let hitPoint = ballY - (rightCarY + carLength / 2);
                    ballSpeedY = hitPoint * 0.2;
                    ballX = canvas.width - 30 - carWidth - ballRadius;
                    spawnSparks(ballX + ballRadius, ballY, -1);
                }
            }

            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.life -= 0.04;
                if (s.life <= 0) sparks.splice(i, 1);
            }

            if (ballX < 0) {
                scoreRight++;
                document.getElementById("scoreRight").innerText = scoreRight;
                checkWinner();
                resetBall(1);
            } else if (ballX > canvas.width) {
                scoreLeft++;
                document.getElementById("scoreLeft").innerText = scoreLeft;
                checkWinner();
                resetBall(-1);
            }
        }

        function checkWinner() {
            if (scoreLeft >= maxScore) {
                alert("🏆 IL TEAM ROSSO VINCE IL GRAN PREMIO!");
                document.location.reload();
            } else if (scoreRight >= maxScore) {
                alert(gameMode === "cpu" ? "🤖 IL COMPUTER (TEAM ORANGE) VINCE IL GRAN PREMIO!"
                                         : "🏆 IL TEAM ORANGE VINCE IL GRAN PREMIO!");
                document.location.reload();
            }
        }

        function draw() {
            ctx.drawImage(bg, 0, 0);

            // Linea di mezzeria con leggero bagliore
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
            ctx.shadowColor = "rgba(255,255,255,0.4)";
            ctx.shadowBlur = 6;
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.restore();

            drawF1Car(30, leftCarY, "red");
            drawF1Car(canvas.width - 30 - carWidth, rightCarY, "orange");

            // Scintille d'impatto
            sparks.forEach(s => {
                ctx.fillStyle = `rgba(255,${180 + Math.random() * 75},60,${s.life})`;
                ctx.fillRect(s.x, s.y, 2.5, 2.5);
            });

            drawTire(ballX, ballY, ballRadius);
        }

        function gameLoop() {
            if (running) update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
